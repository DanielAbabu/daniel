<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="redGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark obsidian background -->
  <rect width="512" height="512" rx="120" fill="#09090b" />
  <rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Stylish editorial Serif D and crimson dot -->
  <g filter="url(#glow)">
    <text
      x="200"
      y="350"
      font-family="Caladea, Fraunces, 'Times New Roman', Georgia, serif"
      font-size="340"
      font-weight="700"
      fill="url(#redGradient)"
      letter-spacing="-0.02em"
      text-anchor="middle"
    >D</text>
    <circle cx="370" cy="340" r="18" fill="#f43f5e" />
  </g>
</svg>